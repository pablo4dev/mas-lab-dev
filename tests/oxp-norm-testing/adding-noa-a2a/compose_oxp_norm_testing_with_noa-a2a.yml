name: oxp

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/ # legit:ignore

x-worker-env: &worker-env
  <<: *rabbitmq-env
  HOME: /oxp
  MPLCONFIGDIR: /oxp/.config/matplotlib
  API_BASE_URL: http://host.docker.internal:8081
  NEO4J_HOST: neo4j:7687
  NEO4J_URI: bolt://neo4j:7687
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: /opt/venv
  PYTHONUNBUFFERED: 1
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}

x-worker-base: &worker-base
  env_file: .env
  depends_on:
    rabbitmq:
      condition: service_healthy
    neo4j:
      condition: service_healthy
  volumes:
    - ./mce_config.yaml:/oxp/mce_config.yaml
    - /dev/null:/app/workflows/.env
  environment: *worker-env

services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD} # legit:ignore
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  oxp-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    env_file: .env
    environment:
      OXP_API_RELOAD: "false"
      PYTHONPATH: /src/api
      CACHE_REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: ${API_CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${API_CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-claris}
      NEO4J_HOST: neo4j
      NEO4J_PORT: ${NEO4J_PORT:-7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-testpassword}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - ./api:/src/api
    ports:
      - "8081:8000"
    command: ["/app/bin/uvicorn", "oxp.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/src/api"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  neo4j:
    image: neo4j:latest
    volumes:
        - /$HOME/neo4j/logs:/logs
        - /$HOME/neo4j/config:/config
        - /$HOME/neo4j/data:/data
        - /$HOME/neo4j/plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-testpassword} # legit:ignore
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-claris}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_started

  slim:
    profiles: ["app-noa-a2a", "all-apps"]
    image: ghcr.io/agntcy/slim:latest
    command: ["/slim", "--config", "/etc/slim/config.yaml"]
    volumes:
      - ./slim-config.yaml:/etc/slim/config.yaml:ro
    ports:
      - "46357:46357"
    restart: unless-stopped

  mcp-server:
    profiles: ["app-noa-a2a", "all-apps"]
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/noa-trip-planner-a2a:${NOA_IMAGE_TAG:-latest}
    platform: ${CLARIS_WORKER_PLATFORM:-linux/amd64}
    command: ["/app/bin/mcp-server"]
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8001
      OTLP_HTTP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started

  norm:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/norm-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command: ["--max-sessions", "-1"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${NORM_MAX_INFLIGHT_MESSAGES:-64}
    restart: always

  noa-trip-planner:
    profiles: ["app-noa", "all-apps"]
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/noa-trip-planner:${NOA_IMAGE_TAG:-latest}
    platform: ${CLARIS_WORKER_PLATFORM:-linux/amd64}
    env_file:
      - path: .env
        required: false
    ports:
      - "${NOA_API_PORT:-8125}:8125"
    environment:
      NOA_API_PORT: 8125
      NOA_API_HOST: 0.0.0.0
      OTLP_HTTP_ENDPOINT: http://otel-collector:4318
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      NOA_LLM_MODEL: ${NOA_LLM_MODEL:-azure/gpt-4o}
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started

  noa-trip-planner-a2a:
    profiles: ["app-noa-a2a", "all-apps"]
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/noa-trip-planner-a2a:${NOA_IMAGE_TAG:-latest}
    
    platform: ${CLARIS_WORKER_PLATFORM:-linux/amd64}
    env_file:
      - path: .env
        required: false
    ports:
      - "${NOA_API_PORT:-8126}:8126"
    environment:
      NOA_API_PORT: 8126
      NOA_API_HOST: 0.0.0.0
      OTLP_HTTP_ENDPOINT: http://otel-collector:4318
      SLIM_ENDPOINT: http://slim:46357
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      A2A_TRANSPORT: slimrpc
      TOOL_TRANSPORT: mcp
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      NOA_LLM_MODEL: ${NOA_LLM_MODEL:-azure/gpt-4o}
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
      slim:
        condition: service_started
      mcp-server:
        condition: service_started

secrets:
  ARTIFACTORY_USERNAME:
    environment: "ARTIFACTORY_USERNAME"
  ARTIFACTORY_PASSWORD:
    environment: "ARTIFACTORY_PASSWORD"

volumes:
  clickhouse_data:
  clickhouse_logs:
