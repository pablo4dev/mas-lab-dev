# OXP norm-testing overlay: enable dual observability output.
# - native -> traces/events.jsonl
# - otel   -> traces/otel_sdk_spans.jsonl (OTLP push uses OTEL_EXPORTER_OTLP_ENDPOINT)
apiVersion: mas/v1
kind: Overlay
metadata:
  name: observability-dual
spec:
  target:
    kind: Agent
  patch:
    observability:
      - native:
          path: traces/events.jsonl
      - otel:
          output_path: traces
