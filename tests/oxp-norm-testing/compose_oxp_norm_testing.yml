name: oxp

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/ # legit:ignore

x-worker-env: &worker-env
  <<: *rabbitmq-env
  HOME: /oxp
  MPLCONFIGDIR: /oxp/.config/matplotlib
  API_BASE_URL: http://host.docker.internal:8081
  NEO4J_HOST: neo4j:7687
  NEO4J_URI: bolt://neo4j:7687
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: /opt/venv
  PYTHONUNBUFFERED: 1
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}

x-worker-base: &worker-base
  env_file: .env
  depends_on:
    rabbitmq:
      condition: service_healthy
    neo4j:
      condition: service_healthy
  volumes:
    - ./mce_config.yaml:/oxp/mce_config.yaml
    - /dev/null:/app/workflows/.env
  environment: *worker-env

services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD} # legit:ignore
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:latest
    volumes:
        - /$HOME/neo4j/logs:/logs
        - /$HOME/neo4j/config:/config
        - /$HOME/neo4j/data:/data
        - /$HOME/neo4j/plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-testpassword} # legit:ignore
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck: # runs SELECT 1, so other services can wait until the database accepts queries.
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot port of observe-and-explain-platform's clickhouse-init-job.yaml
  # (Helm post-install hook). Runs on every `up`; every statement is idempotent,
  # so it only changes anything the first time the database is created.
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: "no"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        ch() {
          clickhouse-client --host "$$CLICKHOUSE_HOST" --port "$$CLICKHOUSE_PORT" \
            --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "$$1"
        }

        # otel_traces is created lazily by the otel-collector's clickhouse exporter
        # on its first connection, so wait for it instead of failing on UNKNOWN_TABLE.
        echo "Waiting for table $$CLICKHOUSE_DATABASE.otel_traces to exist"
        elapsed=0
        until [ "$$(ch "EXISTS TABLE $$CLICKHOUSE_DATABASE.otel_traces")" = "1" ]; do
          if [ "$$elapsed" -ge 120 ]; then
            echo "Timed out waiting for $$CLICKHOUSE_DATABASE.otel_traces (has the otel-collector received any spans yet?)"
            exit 1
          fi
          sleep 2
          elapsed=$$((elapsed + 2))
        done

        ch "ALTER TABLE $$CLICKHOUSE_DATABASE.otel_traces ADD COLUMN IF NOT EXISTS application_id String DEFAULT SpanAttributes['application_id']"
        ch "ALTER TABLE $$CLICKHOUSE_DATABASE.otel_traces ADD COLUMN IF NOT EXISTS session_id String DEFAULT multiIf(position(SpanAttributes['session.id'], '_') > 0, substring(SpanAttributes['session.id'], position(SpanAttributes['session.id'], '_') + 1), SpanAttributes['session.id'])"
        ch "ALTER TABLE $$CLICKHOUSE_DATABASE.otel_traces ADD COLUMN IF NOT EXISTS agent_id String DEFAULT SpanAttributes['agent_id']"
        # Drop byte-identical blocks re-sent by exporter retries (plain MergeTree).
        ch "ALTER TABLE $$CLICKHOUSE_DATABASE.otel_traces MODIFY SETTING non_replicated_deduplication_window = 100"

        echo "ClickHouse setup completed"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
    restart: unless-stopped
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_started

  norm:
    <<: *worker-base
    build:
      context: ../../../oxp-lib
      dockerfile: workers/norm-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command: ["--max-sessions", "-1"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${NORM_MAX_INFLIGHT_MESSAGES:-64}
    restart: always

  noa-trip-planner:
    profiles: ["with-noa"]
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/noa-trip-planner:${NOA_IMAGE_TAG:-latest}
    platform: ${CLARIS_WORKER_PLATFORM:-linux/amd64}
    env_file:
      - path: .env
        required: false
    ports:
      - "${NOA_API_PORT:-8125}:8125"
    environment:
      NOA_API_PORT: 8125
      NOA_API_HOST: 0.0.0.0
      OTLP_HTTP_ENDPOINT: http://otel-collector:4318
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      NOA_LLM_MODEL: ${NOA_LLM_MODEL:-azure/gpt-4o}
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started

  mas-lab:
    profiles: ["with-mas-lab"]
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        echo "WARNING: To be implemented!" >&2
        exit 1
    restart: "no"

secrets:
  ARTIFACTORY_USERNAME:
    environment: "ARTIFACTORY_USERNAME"
  ARTIFACTORY_PASSWORD:
    environment: "ARTIFACTORY_PASSWORD"

volumes:
  clickhouse_data:
  clickhouse_logs:
